name: Build and deploy Suwatte catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Build plugin
        run: npm run build
      - name: Verify compiled Suwatte bundles
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import vm from 'node:vm';
          const catalog = JSON.parse(fs.readFileSync('dist/sources.json', 'utf8'));
          for (const source of catalog.sources) {
            const filename = path.join('dist', 'sources', source.path + '.stt');
            if (!fs.existsSync(filename)) throw new Error('Missing artifact: ' + filename);
            const body = fs.readFileSync(filename, 'utf8');
            console.log(source.id, filename, 'bytes=', Buffer.byteLength(body), 'prefix=', JSON.stringify(body.slice(0, 100)));
            if (/^\\s*</.test(body)) throw new Error('HTML rather than JavaScript: ' + filename);
            try { new vm.Script(body, {filename}); }
            catch (error) { throw new Error('Invalid JavaScript bundle ' + filename + ': ' + error.message); }
          }
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
